name: Azzurro Inverter
version: 0.2.0
slug: azzurro_inverter
description: Fetch Azzurro inverter telemetry and publish Home Assistant MQTT sensors.
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
init: false
services:
  - mqtt:want
options:
  username: ""
  password: ""
  inverter: ""
  update_interval: 5
  firebase_api_key: ""
  discovery_prefix: homeassistant
  log_level: info
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_ssl: false
  mqtt_username: ""
  mqtt_password: ""
schema:
  username: str
  password: password
  inverter: str
  update_interval: int(1,60)
  firebase_api_key: str?
  discovery_prefix: str?
  log_level: list(debug|info)?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_ssl: bool?
  mqtt_username: str?
  mqtt_password: password?
